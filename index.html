<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cereus & Limnic | eReader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dev-splash" class="dev-splash" role="img" aria-label="Developer splash">
        <div class="dev-splash-inner">
            <div class="dev-logo-mark">
                <img src="HAC_studios_logo_2026.png" alt="HAC Studios logo" class="dev-logo-img" />
            </div>
            <div class="dev-logo-text">DEVELOPED</div>
        </div>
    </div>
    <div id="app-container">
        <nav id="hud-top" class="hud-element">
            <button id="menu-btn">☰ Contents</button>
            <span class="book-title">Cereus & Limnic</span>
            <div id="font-controls">
                <button onclick="changeFontSize(-1)">A-</button>
                <button onclick="changeFontSize(1)">A+</button>
            </div>
            <div id="window-controls">
                <button id="fullscreen-btn" aria-pressed="false" title="Toggle fullscreen">⤢ Fullscreen</button>
            </div>
        </nav>

        <div id="side-menu" class="closed">
            <h3>Table of Contents</h3>
            <ul id="toc-list">
                </ul>
        </div>

        <div id="viewer"></div>

        <nav id="hud-bottom" class="hud-element">
            <div class="hud-left">
                <span id="location-indicator">Loading...</span>
            </div>

            <div class="hud-right audio-hud">
                <button id="listen-btn" class="listen-btn" aria-pressed="false" aria-label="Listen to this chapter" disabled>Listen</button>

                <div id="audio-player" class="audio-player" aria-hidden="true" role="region" aria-label="Audio player">
                    <div class="audio-meta">
                        <div id="audio-title" class="audio-title" aria-live="polite"></div>
                    </div>
                    <audio id="chapter-audio" preload="none" controls></audio>
                    <button id="close-audio" class="close-audio" aria-label="Close audio">✕</button>
                </div>
            </div>
        </nav>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
