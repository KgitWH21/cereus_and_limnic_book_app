<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071018">
    <title>Cereus &amp; Limnic | Read or Listen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark home-page">
    <main class="mode-shell">
        <section class="hero-card">
            <div class="hero-brand">
                <img src="assets/HAC_studios_logo_2026.png" alt="HAC Studios logo" class="hero-logo">
                <p class="eyebrow">HAC Studios</p>
            </div>

            <div class="hero-copy">
                <p class="hero-kicker">A twin-mode edition</p>
                <h1>Cereus &amp; Limnic</h1>
                <p class="hero-summary">
                    By Keith Hayden
                </p>
            </div>

            <div class="mode-grid">
                <article class="mode-card">
                    <img src="assets/cereus-limnic-cover.png" alt="Cereus and Limnic book cover" class="mode-art">
                    <h2>Read</h2>
                    <p>Open the EPUB reader with touch navigation, themes, fullscreen controls, and saved reading position.</p>
                    <a class="button-link primary-link" href="reader.html">Open Reader</a>
                </article>

                <article class="mode-card">
                    <img src="assets/cereus-limnic-audiobook-cover.png" alt="Cereus and Limnic audiobook cover" class="mode-art">
                    <h2>Listen</h2>
                    <p>Enjoy custom music, voice acting, and SFX in the audiodrama</p>
                    <a class="button-link" href="listen.html">Open Audiobook</a>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
